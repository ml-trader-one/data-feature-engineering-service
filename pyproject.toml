[project]
name = "feature-service"
version = "0.1.0"
description = "Feature engineering service for market candles"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiokafka[zstd]>=0.11.0",
    "asyncpg>=0.29.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2",
    "ta>=0.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20",
    "python-logging-loki>=0.3",
]

[project.scripts]
serve = "app.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.16.10",
    "pre-commit==4.6.2",
]
[tool.poetry]
packages = [{ include = "app" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
